<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>TGB Kamera — Google ile Giriş</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { text-align: center; padding: 32px; max-width: 360px; }
    .logo { width: 56px; height: 56px; border-radius: 16px; background: #4f46e5; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 14px; }
    .title { font-size: 17px; font-weight: 800; color: #0f172a; margin: 0 0 4px; }
    .sub { font-size: 13px; color: #94a3b8; margin: 0 0 22px; }
    .spinner { width: 36px; height: 36px; border: 4px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { color: #475569; font-size: 15px; }
    .err { color: #dc2626; font-size: 14px; max-width: 320px; }
    .gbtn { display: none; width: 100%; padding: 14px 18px; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; font-size: 15px; font-weight: 700; color: #334155; cursor: pointer; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
    .gbtn:active { background: #f8fafc; }
    .gbtn .g { color: #4285F4; font-weight: 900; margin-right: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎥</div>
    <p class="title">TGB Kamera</p>
    <p class="sub">Değerlendirme Sistemi</p>
    <div class="spinner" id="spinner"></div>
    <p class="msg" id="msg"></p>
    <button class="gbtn" id="gbtn"><span class="g">G</span>Google ile devam et</button>
  </div>

  <script>
    // Bazı Android tarayıcıları / Custom Tab'ler Google gidiş-dönüşü sırasında
    // sessionStorage'ı sıfırlıyor — Firebase'in "missing initial state" hatasının
    // kökü bu. Firebase yüklenmeden ÖNCE sessionStorage'ı kalıcı localStorage'a
    // yönlendiriyoruz; böylece redirect durumu gidiş-dönüşte hayatta kalıyor.
    try {
      var __ls = window.localStorage;
      var __onEk = 'ss:';
      var sahteSS = {
        getItem: function (k) { return __ls.getItem(__onEk + k); },
        setItem: function (k, v) { __ls.setItem(__onEk + k, v); },
        removeItem: function (k) { __ls.removeItem(__onEk + k); },
        clear: function () {
          for (var i = __ls.length - 1; i >= 0; i--) {
            var k = __ls.key(i);
            if (k && k.indexOf(__onEk) === 0) __ls.removeItem(k);
          }
        },
        key: function () { return null; },
      };
      Object.defineProperty(sahteSS, 'length', {
        get: function () {
          var n = 0;
          for (var i = 0; i < __ls.length; i++) if ((__ls.key(i) || '').indexOf(__onEk) === 0) n++;
          return n;
        },
      });
      Object.defineProperty(window, 'sessionStorage', { get: function () { return sahteSS; }, configurable: true });
    } catch (e) { /* engellenirse orijinal sessionStorage kullanılmaya devam eder */ }
  </script>

  <script type="module">
    // ── Akış (eski davranışla aynı, tek dokunuş): sayfa açılır açılmaz Firebase'in
    // kendi yetkili altyapısıyla Google'a yönlendirir (Cloud Console ayarı GEREKMEZ),
    // dönüşte ID token'ı uygulamaya iletir. Redirect durumu yukarıdaki localStorage
    // zırhı sayesinde kaybolmaz; yine de kaybolursa buton ile popup yoluna düşülür.
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithRedirect,
      getRedirectResult,
      signInWithPopup,
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyC_jpZrWJJlRBcIR3dbp_LWijn8p3L9WO0',
      authDomain: 'tgbkamera.firebaseapp.com',
      projectId: 'tgbkamera',
    };

    const msg = document.getElementById('msg');
    const spinner = document.getElementById('spinner');
    const gbtn = document.getElementById('gbtn');
    const fail = (t) => { spinner.style.display = 'none'; gbtn.style.display = 'none'; msg.className = 'err'; msg.textContent = t; };
    const bekleniyor = (t) => { spinner.style.display = 'block'; msg.className = 'msg'; msg.textContent = t; };

    const isValidReturn = (u) => typeof u === 'string' && (u.startsWith('exp://') || u.startsWith('exps://') || u.startsWith('mobile://'));

    const uygulamayaDon = (returnUrl, idToken) => {
      const sep = returnUrl.includes('?') ? '&' : '?';
      location.replace(returnUrl + sep + 'idToken=' + encodeURIComponent(idToken));
    };

    const auth = getAuth(initializeApp(firebaseConfig));
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    function returnUrlBul() {
      const gelen = new URLSearchParams(location.search).get('returnUrl');
      if (gelen && isValidReturn(gelen)) {
        try { localStorage.setItem('tgb_return_url', gelen); } catch {}
        return gelen;
      }
      try {
        const sakli = localStorage.getItem('tgb_return_url');
        if (sakli && isValidReturn(sakli)) return sakli;
      } catch {}
      return null;
    }

    function tokenIlet(returnUrl, result) {
      const cred = GoogleAuthProvider.credentialFromResult(result);
      if (!cred || !cred.idToken) { fail('Google kimlik belgesi (ID token) alınamadı.'); return; }
      try { localStorage.removeItem('tgb_return_url'); } catch {}
      bekleniyor('Uygulamaya dönülüyor…');
      uygulamayaDon(returnUrl, cred.idToken);
    }

    async function popupDene(returnUrl) {
      gbtn.style.display = 'none';
      bekleniyor('Google penceresi açılıyor…');
      try {
        const result = await signInWithPopup(auth, provider);
        tokenIlet(returnUrl, result);
      } catch (e) {
        const kod = (e && e.code) || '';
        if (kod === 'auth/popup-closed-by-user' || kod === 'auth/cancelled-popup-request') {
          spinner.style.display = 'none';
          gbtn.style.display = 'block';
          return;
        }
        fail('Giriş hatası: ' + (e && (e.message || e.code) ? (e.message || e.code) : e));
      }
    }

    async function run() {
      const returnUrl = returnUrlBul();
      if (!returnUrl) return fail('Bu sayfa yalnızca TGB Kamera mobil uygulamasından açılabilir.');

      gbtn.addEventListener('click', () => popupDene(returnUrl));
      bekleniyor('Google ile giriş yapılıyor…');

      // Google'dan dönüş var mı?
      let result = null;
      try {
        result = await getRedirectResult(auth);
      } catch (e) {
        // Redirect durumu yine de kaybolduysa: kullanıcı dokunuşuyla popup yolu
        spinner.style.display = 'none';
        msg.textContent = '';
        gbtn.style.display = 'block';
        return;
      }

      if (result) return tokenIlet(returnUrl, result);

      // Dönüş yok → Google'a yönlendir (otomatik, dokunuş gerektirmez)
      await signInWithRedirect(auth, provider);
    }

    run().catch((e) => fail('Beklenmeyen hata: ' + (e && e.message ? e.message : e)));
  </script>
</body>
</html>
